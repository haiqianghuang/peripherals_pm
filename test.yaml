module: components/peripherals/pm

tests:
  - name: pm-api-functional
    description: Verifies PM init, config, callback, state read, and switch set/get behavior using a mock PM backend.
    category: functional
    scopes: [pr, scheduled]
    timeout_s: 120
    workdir: sdk
    command: |
      bash components/peripherals/pm/tests/test_pm_api_contract.sh functional

  - name: pm-api-error-paths
    description: Verifies null arguments, missing drivers, driver type mismatch, bad switches, and read before init.
    category: functional
    scopes: [pr, scheduled]
    timeout_s: 120
    workdir: sdk
    command: |
      bash components/peripherals/pm/tests/test_pm_api_contract.sh error-paths

  - name: pm-generic-hardware-smoke
    description: Manually verifies the generic PM driver reads real power-supply online and capacity sysfs nodes.
    category: functional
    scopes: [manual]
    timeout_s: 180
    workdir: sdk
    requires:
      hardware:
        - Power-supply nodes PM_CHARGER_NODE and PM_CAPACITY_NODE under /sys/class/power_supply.
      supervision: true
    command: |
      bash components/peripherals/pm/tests/test_hw_pm_generic_smoke.sh
